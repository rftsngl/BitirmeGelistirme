name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/WindowsAiAssistant.Tests/WindowsAiAssistant.Tests.csproj

      - name: Test
        run: dotnet test tests/WindowsAiAssistant.Tests/WindowsAiAssistant.Tests.csproj --configuration Release --no-restore --verbosity minimal
